[package]
name = "taler-merchant"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for the GNU Taler Merchant Backend API (NGI TALER happy-path PoC)"
readme = "README.md"
repository = "https://github.com/theodanielsson2005-cyber/taler-rs"
homepage = "https://github.com/theodanielsson2005-cyber/taler-rs"
authors = ["Theo Danielsson"]
keywords = ["taler", "payments", "merchant", "ngi", "privacy"]
categories = ["api-bindings", "finance"]
exclude = ["/raw_*.json"]

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[[bin]]
name = "taler-merchant-cli"
path = "src/bin/taler-merchant-cli.rs"

[dev-dependencies]
httpmock = "0.7"

[features]
default = []
